# main への push で AWS（Lightsail のコンテナサービス、東京リージョン）へデプロイする。
#
# 秘密の値（DATABASE_URL・CRON_SECRET、任意で DATABASE_URL_UNPOOLED・ANTHROPIC_API_KEY・ADMIN_PASSWORD・ADMIN_SESSION_SECRET）は
# AWS Systems Manager Parameter Store の /zenbu-navi/<名前>（SecureString）から読む。
# 同じ名前の GitHub Secrets があれば、そちらを優先する。
# 秘密でない設定（ロールの ARN・RUM の ID・問い合わせ先）は既定値をこのファイルに持つ。
# 公開 URL は https://zenbu-navi.com に固定する（以前の Variables の値で上書きされないように）。
# 変える場合だけ、同じ名前の Variables（または Secrets）を登録する:
#     AWS_DEPLOY_ROLE_ARN（GitHub OIDC で引き受ける IAM ロール）,
#     CONTACT_EMAIL, NEXT_PUBLIC_RUM_APP_MONITOR_ID, LIGHTSAIL_SERVICE（既定: zenbu-navi）,
#     AI_MODEL / AI_MIN_PUBLISHERS / AI_MAX_PER_RUN
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  SERVICE: ${{ vars.LIGHTSAIL_SERVICE || 'zenbu-navi' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::463470976368:role/zenbu-navi-github-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load secrets
        env:
          GH_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          GH_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          GH_X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          GH_X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          GH_X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          GH_X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          # GitHub Secrets を優先し、なければ Parameter Store から読む。値はログに出さない
          for name in DATABASE_URL DATABASE_URL_UNPOOLED CRON_SECRET ANTHROPIC_API_KEY ADMIN_PASSWORD ADMIN_SESSION_SECRET X_CONSUMER_KEY X_CONSUMER_SECRET X_ACCESS_TOKEN X_ACCESS_TOKEN_SECRET SES_ACCESS_KEY_ID SES_SECRET_ACCESS_KEY NOTIFY_EMAIL GSC_SERVICE_ACCOUNT_JSON; do
            gh_var="GH_${name}"
            value="${!gh_var}"
            source="GitHub Secrets"
            if [ -z "$value" ]; then
              value=$(aws ssm get-parameter --name "/zenbu-navi/${name}" --with-decryption \
                --query Parameter.Value --output text 2>/dev/null || true)
              source="Parameter Store"
            fi
            if [ -z "$value" ] || [ "$value" = "None" ]; then
              echo "${name}: 未登録"
              continue
            fi
            # 複数行の値（Search Console の鍵の JSON）は1行にまとめてから伏せ字にする（伏せ字は行単位で効くため）
            if [ "$name" = "GSC_SERVICE_ACCOUNT_JSON" ]; then
              value=$(printf '%s' "$value" | jq -c . 2>/dev/null || true)
              if [ -z "$value" ]; then echo "${name}: JSON として読めないため使いません"; continue; fi
            fi
            echo "::add-mask::${value}"
            { echo "${name}<<__ZENBU_EOF__"; echo "$value"; echo "__ZENBU_EOF__"; } >> "$GITHUB_ENV"
            echo "${name}: ${source} から読み込みました"
          done

      - name: Check required secrets
        run: |
          missing=0
          for name in DATABASE_URL CRON_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::${name} が見つかりません"; missing=1; fi
          done
          exit $missing

      - name: Install dependencies
        run: npm ci

      - name: Migrate and seed database
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://zenbu-navi.com
          NEXT_PUBLIC_RUM_APP_MONITOR_ID: ${{ vars.NEXT_PUBLIC_RUM_APP_MONITOR_ID || secrets.NEXT_PUBLIC_RUM_APP_MONITOR_ID || '4ace6bfb-62c1-4df7-9956-9cc438ecc7ad' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || secrets.CONTACT_EMAIL || 'coffee.acc9896@gmail.com' }}
        run: |
          npm run build
          # standalone サーバーが配信できるよう、静的ファイルを同じフォルダーにまとめる
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then cp -r public .next/standalone/; fi

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build and push image
        id: image
        run: |
          docker build -t "zenbu-navi:${GITHUB_SHA}" .
          out=$(aws lightsail push-container-image --service-name "$SERVICE" --label web --image "zenbu-navi:${GITHUB_SHA}")
          echo "$out"
          image=$(echo "$out" | grep -o '":[^"]*"' | tail -1 | tr -d '"')
          if [ -z "$image" ]; then echo "::error::イメージ名を取得できませんでした"; exit 1; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          NEXT_PUBLIC_SITE_URL: https://zenbu-navi.com
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || secrets.CONTACT_EMAIL || 'coffee.acc9896@gmail.com' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MIN_PUBLISHERS: ${{ vars.AI_MIN_PUBLISHERS }}
          AI_MAX_PER_RUN: ${{ vars.AI_MAX_PER_RUN }}
          # 常駐サーバーなので、定期収集はサーバー内のスケジューラーで行う（src/instrumentation.ts）
          SCHEDULER_ENABLED: "true"
          # コンテナ環境は HOSTNAME をコンテナ名に書き換えるため、全アドレスで待ち受けるよう明示する
          HOSTNAME: "0.0.0.0"
        run: |
          # 値が空の環境変数は渡さない（DATABASE_URL・CRON_SECRET・ANTHROPIC_API_KEY は Load secrets で設定済み）
          environment=$(jq -n 'env
            | with_entries(select(.key | IN("DATABASE_URL","CRON_SECRET","ANTHROPIC_API_KEY","ADMIN_PASSWORD","ADMIN_SESSION_SECRET","X_CONSUMER_KEY","X_CONSUMER_SECRET","X_ACCESS_TOKEN","X_ACCESS_TOKEN_SECRET","SES_ACCESS_KEY_ID","SES_SECRET_ACCESS_KEY","NOTIFY_EMAIL","GSC_SERVICE_ACCOUNT_JSON","NEXT_PUBLIC_SITE_URL","CONTACT_EMAIL","AI_MODEL","AI_MIN_PUBLISHERS","AI_MAX_PER_RUN","SCHEDULER_ENABLED","HOSTNAME")))
            | with_entries(select(.value != ""))')
          containers=$(jq -n --arg image "$IMAGE" --argjson environment "$environment" \
            '{web: {image: $image, environment: $environment, ports: {"3000": "HTTP"}}}')
          endpoint='{"containerName":"web","containerPort":3000,"healthCheck":{"path":"/robots.txt","successCodes":"200","intervalSeconds":10,"timeoutSeconds":5,"healthyThreshold":2,"unhealthyThreshold":3}}'
          aws lightsail create-container-service-deployment --service-name "$SERVICE" \
            --containers "$containers" --public-endpoint "$endpoint" > /dev/null
          echo "イメージ ${IMAGE} のデプロイを開始しました"

          # このイメージのデプロイが有効になるまで待つ（最大15分）
          for _ in $(seq 1 90); do
            read -r image state next <<< "$(aws lightsail get-container-services --service-name "$SERVICE" \
              --query 'containerServices[0].[currentDeployment.containers.web.image, currentDeployment.state, nextDeployment.state]' \
              --output text)"
            if [ "$image" = "$IMAGE" ] && [ "$state" = "ACTIVE" ]; then echo "デプロイが有効になりました"; exit 0; fi
            if [ "$next" = "FAILED" ]; then echo "::error::デプロイが失敗しました。Lightsail のログを確認してください"; exit 1; fi
            sleep 10
          done
          echo "::error::デプロイが15分以内に有効になりませんでした"
          exit 1

      - name: Show URL
        run: |
          aws lightsail get-container-services --service-name "$SERVICE" --query 'containerServices[0].url' --output text
